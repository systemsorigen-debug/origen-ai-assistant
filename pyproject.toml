[project]
name = "origen_ai_assistant"
authors = [
    { name = "Origen Systems", email = "systemsorigen@gmail.com"}
]
description = "Permission-aware, read-only AI analyst chat for Frappe Desk. No business-record writes, ever."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe is installed and managed by bench.
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3.0"]
openai = ["openai>=1.50.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Advisory only — bench uses this as a compatibility hint, it is not an enforced pip pin.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
    "UP030",
    "UP031",
    "UP032",
    "UP037",
    "UP040",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
